<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="frontendUtils.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="container">
        <!-- Table Section -->
       <div class="button-container" style="margin-bottom: 20px">
           <button onclick="window.location.href='tableView.html'">View Database Tables</button>
       </div>
        <!-- Random Generation -->
       <div>
           <label for="planCount">Number of plans to generate with initial customer:</label>
           <input type="number" id="planCount" min="1" value="10">
       </div>
        <p id="planTimeTaken"></p>
       <div>
           <label for="customerCount">Number of customers to generate for existing plans:</label>
           <input type="number" id="customerCount" min="1" value="20">
       </div>
        <p id="customerTimeTaken"></p>
       <div>
           <label for="callCount">Number of calls to generate:</label>
           <input type="number" id="callCount" min="1" value="50">
       </div>
        <p id="callTimeTaken"></p>

       <div style="margin-bottom: 20px">
           <button onclick="simulate()">SIMULATE</button>
       </div>

       <div>
           <button onclick="updateBills()">Update Bills</button>
       </div>
        <p id="billUpdateTimeTaken"></p>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Forms</h2>
            <div class="form-container">
                <div>
                    <h3>Add Customer to Existing Plan</h3>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <label for="custFN">First Name</label>
                        <input type="text" id="custFN" placeholder="First Name">
                    </div>
                    <div class="form-group">
                        <label for="custLN">Last Name</label>
                        <input type="text" id="custLN" placeholder="Last Name">
                    </div>
                    <div class="form-group">
                        <label for="custDOB">Date of Birth</label>
                        <input type="date" id="custDOB">
                    </div>
                    <div class="form-group">
                        <label for="custAddr">Address</label>
                        <input type="text" id="custAddr" placeholder="Address">
                    </div>
                    <div class="form-group">
                        <label for="planID">Plan ID</label>
                        <input type="number" id="planID" placeholder="Plan ID">
                    </div>
                    <button onclick="addCustomer()">Add Customer</button>
                </div>

            </div>

            <div style="padding-top: 20px;" class="form-container">
                <div>
                    <h3>Set Call Session</h3>
                    <div class="form-group">
                        <label for="callID">Call ID</label>
                        <input type="number" id="callID" placeholder="Select Call ID">
                    </div>
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime">
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <input type="time" id="endTime">
                    </div>
                    <button onclick="">Add Call Session</button>
                </div>

                <div>
                    <h3>Make Payment</h3>
                    <div class="form-group">
                        <label for="payPaid">Select Payment ID</label>
                        <input type="number"    id="payPaid"    placeholder="Select Payment ID">
                    </div>
                    <div class="form-group">
                        <label for="payCust">Select Customer ID</label>
                        <input type="number"    id="payCust"    placeholder="Select Customer ID">
                    </div>
                    <div class="form-group">
                        <label for="payCard">Select Card ID</label>
                        <input type="number"    id="payCard"    placeholder="Select Card ID"><br>
                    </div>
                    
                    <button onclick="">Make Payment</button>
                </div>
            </div>
        </div>
        <div class="generalTables">
            <h2>General Tables</h2>
            <div>
                <!-- Call/Usage Limit -->
                <h3>Call/Usage Limit By Phone</h3>
                <button onclick="toggleRows()">Toggle Table</button>
                <table id="callUsageTable">
                    <thead>
                        <tr>
                            <th>Phone</th>
                            <th>Plan Option</th>
                            <th>Elapsed</th>
                            <th>CALL LIMIT REACHED</th>
                            <th>Data Used</th>
                            <th>USAGE LIMIT REACHED</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="loadMoreContainer" style="display: none;">
                    <button onclick="loadMoreRows()">Load More Rows</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            getCallUsageLimit();
        });
    </script>
</body>
</html>

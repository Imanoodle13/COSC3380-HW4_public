<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Phone Company App Admin Portal</title>
    <style>
        body{
            font-family: Calibri;
            background-color: #0090d8; /**/
        }
        
        .table-list{
            font-family: Calibri;
            font-size: 10px;
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        table{
            border-collapse: collapse;
            width: 30%;
        }

        /* Default Table Color */
        th, td{
            padding: 8px;
            text-align: left;
            border: 1px solid rgb(161, 161, 161);
            background-color: lightgray;
        }

        .form-container{
            gap: 10px;
            margin-top: 20px;
        }
    </style>
    <script src="frontendUtils.js"></script>
    <script>
        async function addCustomer() {
            const firstName = document.getElementById('custFN').value;
            const lastName = document.getElementById('custLN').value;
            const dob = document.getElementById('custDOB').value;
            const address = document.getElementById('custAddr').value;
            const phone = document.getElementById('phone').value;

            try {
                const response = await fetch('/customer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ first_name: firstName, last_name: lastName, dob, address, phone })
                });

                if (response.ok) {
                    alert('Customer added successfully');
                    getCustomers(); // Refresh the table after adding
                } else {
                    alert('Error adding customer');
                }
            } catch (error) {
                console.error('Error adding customer:', error);
            }
        }

    document.querySelector('button').addEventListener('click', addCustomer);
    </script>
</head>
<body>
    <h1>
        CELL PHONE COMPANY ADMIN PORTAL
    </h1>

    <div class="button-container">
        <button onclick="window.location.href='tableView.html'">View Database Tables</button>
    </div>

    <div class="form-container">
        <hr size="5" color=#025e8d>
        <h2>Add Customer</h2>
        <input type="text"      id="custFN"     placeholder="First Name"><br>
        <input type="text"      id="custLN"     placeholder="Last Name"><br>
        <input type="date"      id="custDOB"><br>
        <input type="text"      id="custAddr"   placeholder="Address"><br>
        <input type="text"      id="phone"   placeholder="Phone"><br>
        <button onclick="addCustomer()">Add Customer</button>

        <h2>Add Card</h2>
        <input type="number"    id="cardCust"   placeholder="Select Customer ID"><br>
        <input type="number"    id="cardID"     placeholder="Card ID"><br>
        $<input type="number"   id="cardBal"    placeholder="Balance"><br>
        <button>Add Card</button>

        <h2>Assign Plan</h2>
        <input type="number"    id="apCust"     placeholder="Select Customer ID"><br>
        <input type="number"    id="apPlan"     placeholder="Select Plan (via ID)"><br>
        <button>Assign Plan</button>

        <hr color=#025e8d>
        
        <h2>Set Call Session</h2>   <!-- Consider randomly generated -->
        <input type="number"    id="callID"     placeholder="Select Call ID">
        <h3>Set Start Time</h3>  
        <input type="date"      id="startDate">
        <input type="time"      id="startTime"><br>

        <h3>Set End Time</h3>
        <input type="date"      id="endDate">
        <input type="time"      id="endTime"><br>
        <button>Set Session Time</button>

        <hr color=#025e8d>

        <h2>Make Payment</h2>
        <h3>Select Payment ID</h3>
        <input type="number"    id="payPaid"    placeholder="Select Payment ID">
        <h3>Make Payment</h3>
        <input type="number"    id="payCust"    placeholder="Select Customer ID"><br>
        <input type="number"    id="payCard"    placeholder="Select Card ID"><br>
        <button>Make Payment</button>
    </div>
</body>
</html>

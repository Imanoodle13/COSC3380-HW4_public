<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="frontendUtils.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="container">
        <!-- Table Section -->
       <div class="button-container" style="margin-bottom: 20px">
           <button onclick="window.location.href='tableView.html'">View Database Tables</button>
       </div>
        <!-- Random Generation -->
       <div>
           <label for="planCount">Number of plans to generate with initial customer:</label>
           <input type="number" id="planCount" min="1" value="70">
       </div>
        <p id="planTimeTaken"></p>
       <div>
           <label for="customerCount">Number of customers to generate for existing plans:</label>
           <input type="number" id="customerCount" min="1" value="200">
       </div>
        <p id="customerTimeTaken"></p>
       <div>
           <label for="callCount">Number of calls to generate:</label>
           <input type="number" id="callCount" min="1" value="2000">
       </div>
        <p id="callTimeTaken"></p>

       <div style="margin-bottom: 20px">
           <button onclick="simulate()">SIMULATE</button>
       </div>

       <div>
           <label for="paymentCount">Number of payments to generate</label>
           <input type="number" id="paymentCount" min="1" value="500">
           <button onclick="updateBills()">Update Bills</button>
       </div>
        <p id="billUpdateTimeTaken" style="margin-bottom: 15px"></p>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Forms</h2>
            <div class="form-container">
                <div>
                    <h3>Add Customer to Existing Plan</h3>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <label for="custFN">First Name</label>
                        <input type="text" id="custFN" placeholder="First Name">
                    </div>
                    <div class="form-group">
                        <label for="custLN">Last Name</label>
                        <input type="text" id="custLN" placeholder="Last Name">
                    </div>
                    <div class="form-group">
                        <label for="custDOB">Date of Birth</label>
                        <input type="date" id="custDOB">
                    </div>
                    <div class="form-group">
                        <label for="custAddr">Address</label>
                        <input type="text" id="custAddr" placeholder="Address">
                    </div>
                    <div class="form-group">
                        <label for="planID">Plan ID</label>
                        <input type="number" id="planID" placeholder="Plan ID">
                    </div>
                    <button onclick="addCustomer()">Add Customer</button>
                </div>
        </div>
        <div class="generalTables">
            <h2>General Tables</h2>
            <div>
                <!-- Plan Earnings per Month -->
                <h3>Plan Earnings per Month</h3>
    <div>
        <label for="yearSelect">Year:</label>
        <select id="yearSelect" onchange="loadEarningsForSelectedMonth()">
            <option value="2024" selected>2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
        </select>

        <label for="monthSelect">Month:</label>
        <select id="monthSelect" onchange="loadEarningsForSelectedMonth()">
            <option value="1" selected>January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>
    <h4><span id="queriedMonth"></span></h4>
                <table id="planEarningsTable">
                    <thead>
                        <tr>
                            <th>Option</th>
                            <th>Total Earned</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div>
                <!-- Call/Usage Limit -->
                <h3>Call/Usage Limit By Phone</h3>
                <button onclick="toggleRows()">Toggle Table</button>
                <table id="callUsageTable">
                    <thead>
                        <tr>
                            <th>Phone</th>
                            <th>Plan Option</th>
                            <th>Elapsed</th>
                            <th>CALL LIMIT REACHED</th>
                            <th>Data Used</th>
                            <th>USAGE LIMIT REACHED</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div id="loadMoreContainer" style="display: none;">
                    <button onclick="loadMoreRows()">Load More Rows</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            getCallUsageLimit();
            getEarningsPerPlan();
        });
    </script>
</body>
</html>
